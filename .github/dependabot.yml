version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # The library is upgraded deliberately, together with test/fixtures and
    # the README's accuracy table; Dependabot also has no token for it.
    ignore:
      - dependency-name: "@omcoskun/convert-tools"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
