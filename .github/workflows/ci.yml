name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The library (@omcoskun/convert-tools) comes from GitHub Packages, which
  # always needs a token. The package is public today, so GITHUB_TOKEN can
  # install it. Once it is republished as private, this repository needs Read
  # access under the package's "Manage Actions access" setting.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both LTS lines. The render tests need module.registerHooks
        # (Node 22.15 or later).
        node: ["22.23.4", "24.22.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@omcoskun"

      - name: Install
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
